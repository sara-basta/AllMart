spring.application.name=AllMart

spring.datasource.url=jdbc:postgresql://localhost:5432/allmart
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

allmart.app.jwtSecret=AllMartSuperSecretKeyForJwtSigningMustBeLongEnough123456
allmart.app.jwtExpirationMs=86400000